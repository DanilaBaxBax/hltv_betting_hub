<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Турниры</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-3">
        <div class="container">
            <a class="navbar-brand" href="/">🏆 HLTV Betting Hub</a>
        </div>
    </nav>
    <div class="container">
        <h2>Турниры</h2>
        <div class="list-group">
            {% for t in tournaments %}
            <a href="/tournament/{{ t.eventId }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                {{ t.name }}
                <span class="badge bg-primary rounded-pill">{{ t.count }}</span>
            </a>
            {% endfor %}
        </div>
    </div>
</body>
</html>
